<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>中华民族是一家 · 石榴籽动画</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    }
    body {
      background: linear-gradient(135deg, #fff1eb 0%, #ace0f9 45%, #fff9c4 100%);
      background-size: 200% 200%;
      animation: skyShift 12s ease infinite;
    }
    @keyframes skyShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 0.55rem 1rem 1rem;
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
      z-index: 8;
    }
    .title-wrap h1 {
      font-size: clamp(1.35rem, 2.8vw, 2.1rem);
      color: #d84315;
      text-shadow: 2px 2px 0 #fff, 0 0 12px rgba(255, 193, 7, 0.6);
      letter-spacing: 0.06em;
    }
    .title-wrap p {
      margin-top: 0.2rem;
      font-size: clamp(0.85rem, 1.6vw, 1.05rem);
      color: #5d4037;
      font-weight: 600;
    }
    .btn {
      border: none;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      border-radius: 999px;
      padding: 0.45rem 1rem;
      box-shadow: 0 4px 0 rgba(0,0,0,0.15);
      transition: transform 0.12s, box-shadow 0.12s;
    }
    .btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 rgba(0,0,0,0.15);
    }
    .btn-sound {
      background: #fff;
      color: #e65100;
      font-size: 0.95rem;
    }
    .btn-sound.off { opacity: 0.55; }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .btn-replay {
      background: linear-gradient(180deg, #a5d6a7, #43a047);
      color: #1b5e20;
      font-size: 0.78rem;
      padding: 0.28rem 0.72rem;
      box-shadow: 0 2px 0 rgba(0,0,0,0.15);
    }
    .btn-replay.hidden { display: none; }
    body.can-advance { cursor: pointer; }

    .stage {
      flex: 1;
      min-height: 0;
      position: relative;
      margin-top: 0.2rem;
    }

    .fruit-wrap {
      position: absolute;
      left: 50%;
      top: 46%;
      width: min(58vh, 46vw, 520px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.7s ease, transform 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .fruit-wrap.show {
      opacity: 1;
    }
    .fruit-wrap.opening {
      transform: translate(-50%, -50%) scale(1);
      filter: drop-shadow(0 0 18px rgba(255, 92, 70, 0.38));
    }
    .fruit-wrap.gathering {
      z-index: 1;
      transform: translate(-50%, -50%) scale(1.05);
    }
    .fruit-wrap img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 18px rgba(183, 28, 28, 0.22));
      transition: opacity 0.55s ease;
    }
    #fruitWhole { opacity: 1; }
    #fruitCut { opacity: 0; }
    .fruit-wrap.show-cut #fruitWhole { opacity: 0; }
    .fruit-wrap.show-cut #fruitCut { opacity: 1; }
    .fruit-wrap.idle-sway #fruitWhole {
      animation:
        fruitPopIn 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) both,
        fruitFloat 3.2s ease-in-out 0.85s infinite;
    }
    @keyframes fruitPopIn {
      from { transform: scale(0.55) rotate(-10deg); opacity: 0; }
      to { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes fruitFloat {
      0%, 100% { transform: translateY(0) rotate(-2deg) scale(1); }
      50% { transform: translateY(-12px) rotate(2.4deg) scale(1.04); }
    }
    .fruit-wrap.finale-glow {
      filter: drop-shadow(0 0 22px rgba(255, 82, 82, 0.45));
    }

    .person {
      position: absolute;
      left: 50%;
      top: 46%;
      width: 0;
      height: 0;
      z-index: 4;
      opacity: 0;
      pointer-events: none;
      transition: left 1.15s cubic-bezier(0.18, 0.72, 0.16, 1), top 1.15s cubic-bezier(0.18, 0.72, 0.16, 1);
    }
    .person.featured { z-index: 5; }
    .person.visible { opacity: 1; pointer-events: auto; }
    .person.packed { z-index: 6; transition-timing-function: cubic-bezier(0.22, 0.68, 0, 1); }
    .person-inner {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%) scale(1);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.18rem;
      opacity: 0;
    }
    .person.visible .person-inner {
      opacity: 1;
    }
    .visual {
      position: relative;
      display: grid;
      place-items: center;
    }
    .visual .figure {
      display: block;
      height: 6.4vh;
      width: auto;
      max-height: 56px;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.18));
      transition: transform 0.22s ease, opacity 0.18s ease;
    }
    .person.featured .visual .figure {
      height: 11.5vh;
      max-height: 104px;
    }
    .person.to-seed .visual .figure {
      transform: scale(0.08);
      opacity: 0;
    }
    .name {
      font-size: clamp(0.62rem, 1.05vw, 0.82rem);
      font-weight: 800;
      color: #4e342e;
      background: rgba(255,255,255,0.88);
      padding: 0.08rem 0.38rem;
      border-radius: 999px;
      line-height: 1.2;
      max-width: 6.8em;
      text-align: center;
      box-shadow: 0 2px 0 rgba(0,0,0,0.08);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .person.to-seed .name {
      opacity: 0;
      transform: scale(0.6);
    }

    .seed {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 44px;
      height: 44px;
      object-fit: contain;
      transform: translate(-50%, -50%) scale(0.2) rotate(var(--rot, 0deg));
      opacity: 0;
      pointer-events: none;
      filter: drop-shadow(0 2px 3px rgba(120, 20, 10, 0.28));
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.18s ease, width 0.55s, height 0.55s;
    }
    .person.featured .seed { width: 50px; height: 50px; }
    .person.to-seed .seed {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(var(--rot, 0deg));
    }
    .person.packed .seed {
      width: 34px;
      height: 34px;
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(var(--rot, 0deg));
    }
    .person.merged .seed {
      opacity: 0;
    }
    .person.packed .figure,
    .person.packed .name { display: none; }

    .caption {
      position: absolute;
      left: 50%;
      top: 0.15rem;
      bottom: auto;
      transform: translateX(-50%);
      z-index: 9;
      text-align: center;
      max-width: min(92vw, 820px);
      pointer-events: none;
    }
    .caption-main {
      display: inline-block;
      background: rgba(255,255,255,0.94);
      color: #c62828;
      font-size: clamp(1.15rem, 2.6vw, 1.85rem);
      font-weight: 800;
      line-height: 1.45;
      padding: 0.55rem 1.35rem;
      border-radius: 22px;
      box-shadow: 0 8px 0 rgba(198, 40, 40, 0.18), 0 12px 28px rgba(0,0,0,0.08);
      border: 3px solid #ffcc80;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .caption.show .caption-main {
      opacity: 1;
      transform: translateY(0);
    }
    .caption-sub {
      margin-top: 0.55rem;
      color: #5d4037;
      font-size: clamp(0.95rem, 1.8vw, 1.2rem);
      font-weight: 700;
      text-shadow: 0 1px 0 #fff;
      opacity: 0;
      transition: opacity 0.45s ease 0.15s;
    }
    .caption.show-sub .caption-sub { opacity: 1; }

    .tip-chip {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translate(-50%, calc(-100% - 8px));
      background: #fff;
      color: #c62828;
      font-weight: 800;
      font-size: 0.85rem;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      box-shadow: 0 3px 8px rgba(0,0,0,0.15);
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 8;
    }
    .person.packed.show-tip .tip-chip { opacity: 1; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="title-wrap">
        <h1>中华民族是一家</h1>
        <p id="hintText">先看这颗大石榴</p>
      </div>
      <div class="toolbar">
        <button type="button" class="btn btn-replay hidden" id="btnReplay">重播</button>
        <button type="button" class="btn btn-sound" id="btnSound" aria-pressed="true">🔊 声音开</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="fruit-wrap" id="fruitWrap">
        <img id="fruitWhole" src="石榴_整颗_教材插画风_透明底_1080.png" alt="大石榴" />
        <img id="fruitCut" src="石榴剖面_教材插画风_透明底_1080.png" alt="石榴剖面" />
      </div>
      <div id="peopleLayer"></div>

      <div class="caption" id="caption">
        <div class="caption-main" id="captionMain"></div>
        <div class="caption-sub" id="captionSub"></div>
      </div>
    </div>
  </div>

  <script>
    const NAMES = [
      "蒙古族","回族","藏族","维吾尔族","苗族","彝族","壮族","布依族","朝鲜族","满族",
      "侗族","瑶族","白族","土家族","哈尼族","哈萨克族","傣族","黎族","傈僳族","佤族",
      "畲族","高山族","拉祜族","水族","东乡族","纳西族","景颇族","柯尔克孜族","土族","达斡尔族",
      "仫佬族","羌族","布朗族","撒拉族","毛南族","仡佬族","锡伯族","阿昌族","普米族","塔吉克族",
      "怒族","乌孜别克族","俄罗斯族","鄂温克族","德昂族","保安族","裕固族","京族","塔塔尔族","独龙族",
      "鄂伦春族","赫哲族","门巴族","珞巴族","基诺族","汉族"
    ];

    const FEATURED = {
      "蒙古族": "蒙古族小女孩_教材插画风_透明底_1080.png",
      "回族": "回族小女孩_教材插画风_透明底_1080.png",
      "藏族": "藏族小男孩_教材插画风_透明底_1080.png",
      "维吾尔族": "维吾尔族小女孩_教材插画风_透明底_1080.png",
      "苗族": "苗族小女孩_教材插画风_透明底_1080.png",
      "壮族": "壮族小男孩_教材插画风_透明底_1080.png",
      "朝鲜族": "朝鲜族小女孩_教材插画风_透明底_1080.png",
      "哈尼族": "哈尼族小男孩_教材插画风_透明底_1080.png",
      "傣族": "傣族小女孩_教材插画风_透明底_1080.png",
      "傈僳族": "傈僳族小男孩_教材插画风_透明底_1080.png",
    };

    const FEATURED_ORDER = ["蒙古族","回族","藏族","维吾尔族","苗族","壮族","朝鲜族","哈尼族","傣族","傈僳族"];

    const SEED_IMG = "石榴籽_单粒_教材插画风_透明底_1080.png";
    const CUT_ASPECT = 1;
    const PIT_SLOTS = [{"x":0.2949,"y":0.4171},{"x":0.4375,"y":0.6819},{"x":0.3763,"y":0.4986},{"x":0.6615,"y":0.3967},{"x":0.2339,"y":0.4578},{"x":0.3765,"y":0.3154},{"x":0.7431,"y":0.4171},{"x":0.6006,"y":0.7429},{"x":0.3357,"y":0.3763},{"x":0.6617,"y":0.4783},{"x":0.6615,"y":0.8041},{"x":0.3154,"y":0.7025},{"x":0.7227,"y":0.4782},{"x":0.6822,"y":0.7024},{"x":0.7836,"y":0.6614},{"x":0.2543,"y":0.702},{"x":0.6208,"y":0.4171},{"x":0.417,"y":0.7225},{"x":0.4373,"y":0.4986},{"x":0.7226,"y":0.641},{"x":0.5601,"y":0.7023},{"x":0.2539,"y":0.5803},{"x":0.397,"y":0.458},{"x":0.3559,"y":0.6412},{"x":0.3355,"y":0.5799},{"x":0.2947,"y":0.4788},{"x":0.6009,"y":0.3559},{"x":0.5796,"y":0.6409},{"x":0.5798,"y":0.498},{"x":0.6617,"y":0.3159},{"x":0.2335,"y":0.6211},{"x":0.5801,"y":0.8034},{"x":0.4165,"y":0.3766},{"x":0.7025,"y":0.4169},{"x":0.5399,"y":0.5802},{"x":0.6406,"y":0.6},{"x":0.2332,"y":0.5187},{"x":0.2941,"y":0.6416},{"x":0.6414,"y":0.5384},{"x":0.3976,"y":0.5805},{"x":0.3553,"y":0.8044},{"x":0.295,"y":0.5599},{"x":0.6826,"y":0.5193},{"x":0.2957,"y":0.3359},{"x":0.6418,"y":0.7635},{"x":0.7837,"y":0.4985},{"x":0.7228,"y":0.3761},{"x":0.5403,"y":0.7628},{"x":0.6618,"y":0.4377},{"x":0.3767,"y":0.3766},{"x":0.6412,"y":0.6809},{"x":0.7223,"y":0.5186},{"x":0.356,"y":0.4384},{"x":0.3767,"y":0.7639},{"x":0.3355,"y":0.3149},{"x":0.6818,"y":0.7644}];

    const people = [];
    let soundOn = true;
    let audioCtx = null;
    let runId = 0;
    let phase = "idle";

    let canAdvance = false;

    const btnSound = document.getElementById("btnSound");
    const btnReplay = document.getElementById("btnReplay");
    const fruitWrap = document.getElementById("fruitWrap");
    const peopleLayer = document.getElementById("peopleLayer");
    const caption = document.getElementById("caption");
    const captionMain = document.getElementById("captionMain");
    const captionSub = document.getElementById("captionSub");
    const hintText = document.getElementById("hintText");

    function ensureAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    }
    function playTone(freq, when, duration, type = "sine", gain = 0.16) {
      if (!soundOn || !audioCtx) return;
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, when);
      g.gain.exponentialRampToValueAtTime(gain, when + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, when + duration);
      osc.connect(g);
      g.connect(audioCtx.destination);
      osc.start(when);
      osc.stop(when + duration + 0.05);
    }
    function playClick() {
      ensureAudio();
      const t = audioCtx.currentTime;
      playTone(880, t, 0.08, "triangle", 0.12);
      playTone(1175, t + 0.06, 0.1, "sine", 0.1);
    }
    function playFruit() {
      ensureAudio();
      const t = audioCtx.currentTime;
      playTone(392, t, 0.28, "triangle", 0.12);
      playTone(523, t + 0.16, 0.32, "sine", 0.14);
    }
    function playPop(i) {
      ensureAudio();
      const t = audioCtx.currentTime;
      playTone(620 + (i % 8) * 28, t, 0.08, "triangle", 0.06);
    }
    function playSeed() {
      ensureAudio();
      const t = audioCtx.currentTime;
      playTone(740, t, 0.12, "sine", 0.1);
      playTone(988, t + 0.08, 0.14, "triangle", 0.08);
    }
    function playWave() {
      ensureAudio();
      const t = audioCtx.currentTime;
      playTone(523, t, 0.12, "triangle", 0.08);
      playTone(659, t + 0.07, 0.12, "sine", 0.08);
      playTone(784, t + 0.14, 0.16, "triangle", 0.07);
    }
    function playGather() {
      ensureAudio();
      const t = audioCtx.currentTime;
      [392, 494, 587, 739, 880].forEach((f, i) => {
        playTone(f, t + i * 0.11, 0.28, i % 2 ? "sine" : "triangle", 0.1);
      });
    }
    function playFinale() {
      ensureAudio();
      const t = audioCtx.currentTime;
      playTone(523, t, 0.35, "triangle", 0.12);
      playTone(659, t + 0.12, 0.4, "sine", 0.12);
      playTone(784, t + 0.24, 0.55, "triangle", 0.14);
    }

    function wait(ms, id) {
      return new Promise((resolve) => {
        setTimeout(() => resolve(id === runId), ms);
      });
    }

    function crowdLayout() {
      const n = NAMES.length;
      const golden = Math.PI * (3 - Math.sqrt(5));
      const pts = Array.from({ length: n }, (_, i) => {
        const r = Math.sqrt(i / (n - 1));
        const a = i * golden;
        return {
          x: 50 + 31 * r * Math.cos(a),
          y: 53 + 34 * r * Math.sin(a),
          r,
        };
      });
      const names = [...FEATURED_ORDER, ...NAMES.filter((n) => !FEATURED[n])];
      return names.map((name, i) => ({ name, x: pts[i].x, y: pts[i].y }));
    }

    function offscreenStart(destX, destY, i) {
      let dx = destX - 50;
      let dy = destY - 52;
      let len = Math.hypot(dx, dy);
      if (len < 5) {
        const a = (i * 137.508) * Math.PI / 180;
        dx = Math.cos(a);
        dy = Math.sin(a);
        len = 1;
      }
      const nx = dx / len;
      const ny = dy / len;
      return { x: 50 + nx * 78, y: 52 + ny * 82 };
    }

    function slotToStage(slot, wrap, stage) {
      const wrapW = wrap.width;
      const wrapH = wrap.height;
      let drawW, drawH, offX, offY;
      if (CUT_ASPECT > wrapW / wrapH) {
        drawW = wrapW;
        drawH = wrapW / CUT_ASPECT;
        offX = 0;
        offY = (wrapH - drawH) / 2;
      } else {
        drawH = wrapH;
        drawW = wrapH * CUT_ASPECT;
        offX = (wrapW - drawW) / 2;
        offY = 0;
      }
      return {
        x: wrap.left - stage.left + offX + slot.x * drawW,
        y: wrap.top - stage.top + offY + slot.y * drawH,
      };
    }

    function buildPeople() {
      peopleLayer.replaceChildren();
      people.length = 0;
      let sil = 0;
      NAMES.forEach((name, i) => {
        const featured = Boolean(FEATURED[name]);
        const el = document.createElement("div");
        el.className = "person" + (featured ? " featured" : "");
        el.dataset.name = name;
        const inner = document.createElement("div");
        inner.className = "person-inner";
        const visual = document.createElement("div");
        visual.className = "visual";
        const img = document.createElement("img");
        img.className = "figure";
        img.alt = name;
        if (featured) {
          img.src = FEATURED[name];
        } else {
          const n = ((sil * 3) % 10) + 1;
          sil += 1;
          img.src = `silhouettes/color-silhouette-${String(n).padStart(2, "0")}.png`;
        }
        const seed = document.createElement("img");
        seed.className = "seed";
        seed.src = SEED_IMG;
        seed.alt = "";
        seed.style.setProperty("--rot", ((i * 47) % 70) - 35 + "deg");
        visual.append(img, seed);
        const label = document.createElement("div");
        label.className = "name";
        label.textContent = name;
        const tip = document.createElement("div");
        tip.className = "tip-chip";
        tip.textContent = name;
        inner.append(visual, label, tip);
        el.append(inner);
        el.addEventListener("click", () => {
          if (!el.classList.contains("packed")) return;
          people.forEach((p) => p.el.classList.remove("show-tip"));
          el.classList.add("show-tip");
          playClick();
        });
        peopleLayer.append(el);
        people.push({ name, featured, el });
      });
    }

    function setCaption(main, sub = "") {
      caption.classList.remove("show", "show-sub");
      captionMain.textContent = main;
      captionSub.textContent = sub;
      requestAnimationFrame(() => {
        caption.classList.add("show");
        if (sub) caption.classList.add("show-sub");
      });
    }

    function setCanAdvance(show) {
      canAdvance = show;
      document.body.classList.toggle("can-advance", show);
    }
    function showReplay(show) {
      btnReplay.classList.toggle("hidden", !show);
    }

    function resetVisuals() {
      fruitWrap.className = "fruit-wrap";
      people.forEach((p, i) => {
        p.el.classList.remove("visible", "to-seed", "packed", "merged", "show-tip");
        const start = offscreenStart(50, 52, i);
        p.el.style.transition = "none";
        p.el.style.left = start.x + "%";
        p.el.style.top = start.y + "%";
        void p.el.offsetWidth;
        p.el.style.transition = "";
      });
      caption.classList.remove("show", "show-sub");
      setCanAdvance(false);
      showReplay(false);
    }

    async function phaseOpening() {
      phase = "opening";
      hintText.textContent = "点屏幕任意处继续";
      resetVisuals();
      void fruitWrap.offsetWidth;
      fruitWrap.classList.add("show", "opening", "idle-sway");
      setCaption("如果说中国是一颗大石榴");
      playFruit();
      setCanAdvance(true);
    }

    async function phaseScatter() {
      phase = "scatter";
      hintText.textContent = "56 个民族从四面八方赶来";
      setCanAdvance(false);
      fruitWrap.classList.remove("idle-sway");
      fruitWrap.classList.remove("show");
      setCaption("那56个民族就像是……");

      const layout = crowdLayout();
      const byName = Object.fromEntries(layout.map((p) => [p.name, p]));

      people.forEach((p, i) => {
        const dest = byName[p.name];
        const start = offscreenStart(dest.x, dest.y, i);
        p.el.style.transition = "none";
        p.el.style.left = start.x + "%";
        p.el.style.top = start.y + "%";
        void p.el.offsetWidth;
        p.el.style.transition = "";
        p.el.classList.add("visible");
        const delay = (i % 4) * 70 + Math.floor(i / 14) * 90;
        setTimeout(() => {
          p.el.style.left = dest.x + "%";
          p.el.style.top = dest.y + "%";
          if (i % 5 === 0) playPop(i);
        }, delay);
      });

      const id = runId;
      if (!(await wait(1750, id))) return;
      if (phase === "scatter") {
        hintText.textContent = "点屏幕任意处继续";
        setCanAdvance(true);
      }
    }

    function toSeed(p) {
      p.el.classList.add("to-seed");
    }

    async function phaseTransformAndGather() {
      phase = "transform";
      hintText.textContent = "他们变成石榴籽啦";
      caption.classList.remove("show", "show-sub");
      setCanAdvance(false);
      const id = runId;

      const order = [
        ...FEATURED_ORDER.map((n) => people.find((p) => p.name === n)),
        ...people.filter((p) => !p.featured),
      ];
      for (let i = 0; i < order.length; i++) {
        if (runId !== id) return;
        toSeed(order[i]);
        if (i % 3 === 0) playSeed();
        if (!(await wait(36, id))) return;
      }

      if (!(await wait(180, id))) return;
      phase = "gather";
      hintText.textContent = "看石榴的剖面，籽要回家了";
      fruitWrap.classList.add("show", "gathering", "show-cut");
      playGather();
      if (!(await wait(450, id))) return;

      const wrap = fruitWrap.getBoundingClientRect();
      const stage = document.getElementById("stage").getBoundingClientRect();
      const packed = PIT_SLOTS.map((slot) => slotToStage(slot, wrap, stage));

      const flights = people.map((p, i) => {
        const rect = p.el.getBoundingClientRect();
        const x = rect.left + rect.width / 2 - stage.left;
        const y = rect.top + rect.height / 2 - stage.top;
        const tx = packed[i].x;
        const ty = packed[i].y;
        return { p, x, y, tx, ty, dist: Math.hypot(tx - x, ty - y) };
      });
      flights.sort((a, b) => b.dist - a.dist);

      flights.forEach((f, i) => {
        setTimeout(() => {
          if (runId !== id) return;
          const leftPct = (f.tx / stage.width) * 100;
          const topPct = (f.ty / stage.height) * 100;
          f.p.el.style.left = leftPct + "%";
          f.p.el.style.top = topPct + "%";
          f.p.el.classList.add("packed");
        }, i * 20);
      });

      if (!(await wait(flights.length * 20 + 900, id))) return;
      people.forEach((p) => p.el.classList.add("merged"));
      if (!(await wait(400, id))) return;
      phaseFinale();
    }

    function phaseFinale() {
      phase = "finale";
      hintText.textContent = "各民族像石榴籽一样紧紧抱在一起";
      fruitWrap.classList.add("finale-glow");
      setCaption("就像是石榴籽紧紧抱在一起");
      playFinale();
      setCanAdvance(false);
      showReplay(true);
    }

    async function startShow() {
      runId += 1;
      await phaseOpening();
    }

    async function onNext() {
      if (!canAdvance) return;
      setCanAdvance(false);
      playClick();
      if (phase === "opening") {
        await phaseScatter();
      } else if (phase === "scatter") {
        await phaseTransformAndGather();
      }
    }

    document.addEventListener("click", (e) => {
      if (e.target.closest("#btnSound, #btnReplay")) return;
      onNext();
    });
    btnReplay.addEventListener("click", (e) => {
      e.stopPropagation();
      playClick();
      startShow();
    });
    btnSound.addEventListener("click", () => {
      soundOn = !soundOn;
      btnSound.textContent = soundOn ? "🔊 声音开" : "🔇 声音关";
      btnSound.classList.toggle("off", !soundOn);
      btnSound.setAttribute("aria-pressed", String(soundOn));
      if (soundOn) ensureAudio();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") people.forEach((p) => p.el.classList.remove("show-tip"));
      if (e.key === "Enter" || e.key === " ") onNext();
    });

    buildPeople();
    startShow();
    [
      "石榴_整颗_教材插画风_透明底_1080.png",
      "石榴剖面_教材插画风_透明底_1080.png",
      "石榴籽_单粒_教材插画风_透明底_1080.png",
      ...Object.values(FEATURED),
      ...Array.from({ length: 10 }, (_, i) => `silhouettes/color-silhouette-${String(i + 1).padStart(2, "0")}.png`),
    ].forEach((src) => { const im = new Image(); im.src = src; });
  </script>
</body>
</html>
